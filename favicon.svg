<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Honeycomb hex background -->
  <rect width="100" height="100" rx="20" fill="#091c18"/>
  <!-- Hexagon shape representing honeycomb -->
  <polygon points="50,8 88,28 88,68 50,88 12,68 12,28" fill="none" stroke="#4ecdc4" stroke-width="4"/>
  <!-- Inner hex accent -->
  <polygon points="50,20 78,35 78,65 50,80 22,65 22,35" fill="none" stroke="#f7d060" stroke-width="2" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="8" fill="#4ecdc4"/>
  <!-- Small accent dots -->
  <circle cx="50" cy="28" r="3" fill="#f7d060"/>
  <circle cx="74" cy="64" r="3" fill="#f7d060"/>
  <circle cx="26" cy="64" r="3" fill="#f7d060"/>
</svg>
